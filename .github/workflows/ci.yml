# Checks every pull request and every push to main:
# type check, production build, prerender of all public pages and the SEO audit
# (scripts/seo-audit.mjs fails on duplicate titles, broken internal links, missing H1, sitemap drift).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build, prerender and SEO audit
        # No secrets needed: without Supabase env vars, studio pages are skipped from prerender.
        run: npm run build
